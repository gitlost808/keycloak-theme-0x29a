# Login pages in the style of www.0x29a.me (the dummypage repository):
# Kode Mono, Solarized green on near-black, a glowing outlined box and typed
# headings. Templates, messages and PatternFly come from keycloak.v2; this
# theme replaces only the footer and adds a stylesheet and a script.
parent=keycloak.v2

# css/styles.css resolves to keycloak.v2's own stylesheet.
styles=css/styles.css css/0x29a.css
scripts=js/0x29a.js

# Always dark, like the main page: no prefers-color-scheme toggle, and
# PatternFly's dark tokens apply as the base the stylesheet recolours.
darkMode=false
kcHtmlClass=login-pf pf-v5-theme-dark

meta=theme-color==#859900
